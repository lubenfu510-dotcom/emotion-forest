<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf3f2">
<title>暖一小会儿 · 火把融冰</title>
<style>
:root{--ink:#29434b;--muted:#82969a;--ice:#9bd6df;--ice-light:#e2f8f6;--warm:#ef9863;--warm-dark:#c86d47;--paper:#fffdf8;--line:#e5ece7;--shadow:0 24px 70px #48615d16}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;background:radial-gradient(ellipse at 17% 12%,#fffdf5 0,transparent 29%),radial-gradient(ellipse at 88% 87%,#d9ebe4 0,transparent 31%),#edf4f1;display:grid;place-items:center;padding:28px 20px}
button{font:inherit;color:inherit}
.shell{width:min(1060px,100%);margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:0 auto 20px;padding:0 5px;max-width:980px}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:15px;background:#fffaf0;display:grid;place-items:center;box-shadow:0 5px 18px #88745115;border:1px solid #f0e6d6;font-size:22px}.brand-copy b{display:block;font:700 17px/1.2 "STKaiti","KaiTi","Songti SC",serif;letter-spacing:.06em}.brand-copy span{display:block;margin-top:4px;color:#91a09b;font-size:10px;letter-spacing:.13em}
.top-actions{display:flex;gap:8px}.icon-button{border:1px solid #dce7e2;background:#ffffffa6;border-radius:99px;padding:9px 13px;color:#748985;font-size:12px;cursor:pointer;transition:.2s}.icon-button:hover{background:#fff;transform:translateY(-1px)}
.layout{display:grid;grid-template-columns:minmax(0,1.46fr) minmax(275px,.8fr);gap:22px;align-items:stretch;max-width:980px;margin:auto}
.scene-card,.side-card{background:var(--paper);border:1px solid #e5ebe4;border-radius:30px;box-shadow:var(--shadow)}
.scene-card{padding:14px;overflow:hidden}.scene{height:520px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#d9eff0 0%,#ecf5ed 57%,#eff4e9 100%);isolation:isolate}
.aurora{position:absolute;inset:-50px -10px auto;height:220px;opacity:.75;background:radial-gradient(ellipse at 21% 30%,#f9e9c988 0,transparent 52%),radial-gradient(ellipse at 70% 5%,#bfe4df 0,transparent 42%);filter:blur(5px);animation:aurora 8s ease-in-out infinite alternate}
.sun{position:absolute;width:63px;height:63px;border-radius:50%;right:14%;top:70px;background:#ffe7aa;box-shadow:0 0 0 13px #ffe9b53b,0 0 48px #ffdc9b88;transition:all .6s}
.scene-head{position:absolute;z-index:3;left:25px;top:23px}.scene-kicker{font-size:10px;letter-spacing:.18em;color:#78999a}.scene-title{font:600 17px/1.4 "STKaiti","KaiTi","Songti SC",serif;color:#55777a;margin-top:6px}.weather{position:absolute;z-index:2;right:23px;top:23px;padding:7px 10px;background:#ffffff75;border:1px solid #ffffff8c;border-radius:99px;color:#729094;font-size:10px;letter-spacing:.04em;backdrop-filter:blur(6px)}
.cloud{position:absolute;width:86px;height:25px;left:13%;top:120px;border-radius:99px;background:#fffdf8a1;opacity:.74}.cloud:before,.cloud:after{content:"";position:absolute;bottom:5px;border-radius:50%;background:inherit}.cloud:before{width:35px;height:35px;left:15px}.cloud:after{width:28px;height:28px;left:43px}.cloud.two{left:auto;right:12%;top:174px;transform:scale(.72);opacity:.48}
.hill{position:absolute;z-index:0;bottom:-31px;width:120%;height:190px;left:-10%;border-radius:50% 50% 0 0;background:#dcebe0}.hill.back{bottom:39px;left:-28%;width:86%;height:116px;background:#e8f1e5;transform:rotate(-5deg)}.hill.far{bottom:60px;left:53%;width:92%;height:106px;background:#e4eee4;transform:rotate(6deg)}
.snowflake{position:absolute;color:#fffefa;opacity:.8;font-size:17px;animation:drift 5s ease-in-out infinite}.snowflake.s1{top:220px;left:18%;animation-delay:-1s}.snowflake.s2{top:270px;right:17%;font-size:12px;animation-delay:-3s}.snowflake.s3{top:104px;left:59%;font-size:10px;animation-delay:-2s}
.art{position:absolute;z-index:1;width:min(80%,380px);height:auto;left:50%;top:106px;transform:translateX(-50%);overflow:visible}.ice-shadow{fill:#779e9a20;transition:all .7s}.puddle{transform-box:fill-box;transform-origin:center;transition:all .7s ease;fill:#8ed1d6;opacity:.82}.puddle-shine{fill:none;stroke:#efffff;stroke-width:4;stroke-linecap:round;opacity:.9}.ice-group{transform-box:fill-box;transform-origin:50% 100%;transition:transform .85s cubic-bezier(.2,.75,.3,1),opacity .6s}.ice-facet{fill:#daf5f4;opacity:.82}.ice-facet2{fill:#84c7d5;opacity:.68}.ice-line{fill:none;stroke:#f5ffff;stroke-width:3;stroke-linecap:round;opacity:.8}.engraving{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-weight:650;letter-spacing:1.4px;fill:#f6ffff;stroke:#65aab5;stroke-width:.65;paint-order:stroke;opacity:.88;filter:drop-shadow(1px 1.5px 0 #4f909c88);transition:opacity .45s}.crack{fill:none;stroke:#72b9c5;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s}.chip{fill:#b5e3e6;opacity:0;transform:translateY(0);transition:opacity .3s}.drip{opacity:0;animation:drip 1.5s ease-in infinite}.drip:nth-of-type(2){animation-delay:.45s}.drip:nth-of-type(3){animation-delay:.9s}.plant{opacity:0;transform:translateY(6px);transition:all .8s .2s}.plant-leaf{fill:#91bd8d}.plant-flower{fill:#f3c881}
.ending{position:absolute;z-index:4;inset:0;display:grid;align-content:center;justify-items:center;text-align:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:.7s}.ending b{font:700 22px "STKaiti","KaiTi",serif;color:#527777}.ending span{margin-top:7px;color:#819899;font-size:12px}
.torch-button{position:absolute;z-index:5;left:50%;bottom:23px;transform:translateX(-50%);display:flex;align-items:center;gap:11px;padding:12px 21px 12px 14px;border:1px solid #f3d0b5;border-radius:99px;background:#fffaf1;color:#905b42;box-shadow:0 7px 0 #e9d3bd,0 12px 25px #7a614126;cursor:pointer;touch-action:none;user-select:none;transition:transform .16s,box-shadow .16s,background .2s;white-space:nowrap}.torch-button:hover{background:#fff4e5}.torch-button:active,.torch-button.heating{transform:translate(-50%,3px) scale(.98);box-shadow:0 3px 0 #e9d3bd,0 7px 18px #7a614126}.torch-button svg{width:29px;height:31px;overflow:visible}.torch-flame{transform-origin:50% 82%;animation:flame 1s ease-in-out infinite alternate}.torch-button.heating .torch-flame{animation-duration:.32s}.torch-copy{text-align:left;font-size:12px;font-weight:700;line-height:1.2}.torch-copy small{display:block;margin-top:4px;color:#af8a72;font-size:9px;font-weight:500;letter-spacing:.04em}
.warmth{position:absolute;z-index:2;bottom:79px;left:50%;width:245px;height:150px;transform:translateX(-50%);background:radial-gradient(ellipse,#ffc78062 0%,#ffdcaa2b 38%,transparent 72%);opacity:calc(.17 + var(--heat,0)*.4);transition:opacity .2s;pointer-events:none;filter:blur(8px)}
.scene-status{position:absolute;z-index:4;left:50%;bottom:91px;transform:translateX(-50%);background:#ffffffba;border:1px solid #fff;border-radius:99px;padding:7px 12px;color:#729092;font-size:10px;white-space:nowrap;box-shadow:0 4px 13px #647a6b12;transition:.25s}.scene-status b{color:#be8058;font-weight:650}
.side-card{padding:31px 29px;display:flex;flex-direction:column}.eyebrow{font-size:10px;letter-spacing:.17em;color:#9aa9a0}.side-card h1{font:700 clamp(30px,4vw,43px)/1.24 "STKaiti","KaiTi","Songti SC",serif;letter-spacing:.02em;margin:15px 0 11px;color:#304f55}.side-card h1 em{font-style:normal;color:#d7895d}.intro{margin:0;color:#82938e;font:14px/1.9 "STKaiti","KaiTi","Songti SC",serif}.divider{border:0;border-top:1px dashed #e2e8df;width:100%;margin:24px 0 19px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;color:#728680;font-size:11px}.progress-top strong{font:600 20px Georgia,serif;color:#527c7b}.progress-track{height:9px;border-radius:99px;background:#eaf0e9;margin-top:10px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#f3c28d,#df9060 72%,#c97954);border-radius:inherit;transition:width .32s ease;box-shadow:0 0 12px #efb78480}
.message{min-height:67px;margin-top:18px;padding:13px 14px;border-radius:15px;background:#f4f7f0;color:#788d82;font:13px/1.65 "STKaiti","KaiTi","Songti SC",serif;transition:.35s}.message strong{display:block;color:#597a70;font-size:14px;margin-bottom:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:23px}.stat{border:1px solid #edf0e9;border-radius:15px;padding:13px 12px;background:#fffefa}.stat span{display:block;color:#9aa7a0;font-size:10px}.stat b{display:block;margin-top:6px;color:#57716d;font:600 17px Georgia,"PingFang SC",serif}.restart{margin-top:15px;padding:11px;border:1px solid #e7ebe4;border-radius:99px;background:transparent;color:#94a39b;font-size:11px;cursor:pointer;transition:.2s}.restart:hover{border-color:#d4dfd5;background:#f7f9f4;color:#6c887b}
.footer-note{text-align:center;color:#9eaaa3;font:12px "STKaiti","KaiTi",serif;margin:19px 0 0;letter-spacing:.04em}
.compact-card{padding:16px 18px 14px;gap:0}.compact-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.compact-heading h2{margin:4px 0 0;color:#304f55;font:700 22px/1.2 "STKaiti","KaiTi","Songti SC",serif}.compact-heading>strong{color:#d7895d;font:700 22px Georgia,serif}.compact-card .progress-track{margin:12px 0 10px;height:7px}.compact-card .message{min-height:0;margin:0;padding:10px 12px;border-radius:14px;font-size:11px;line-height:1.5}.compact-card .message strong{display:inline;margin:0 6px 0 0;font-size:12px}.compact-stats{display:flex;gap:8px;margin-top:9px}.compact-stats>div{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border:1px solid #e5ece7;border-radius:12px;background:#fffefa}.compact-stats span{font-size:9px;color:#91a09b}.compact-stats b{font:600 13px Georgia,"PingFang SC",serif;color:#57716d;white-space:nowrap}
@media(max-width:760px){.side-card.compact-card{padding:14px 16px 12px;border-radius:20px}.compact-heading h2{font-size:20px}.compact-card .progress-track{margin:9px 0 8px}.compact-card .message{padding:9px 10px}.compact-stats{margin-top:7px}}
.prelude{width:min(670px,100%);margin:5vh auto 0;padding:clamp(27px,6vw,54px);position:relative;overflow:hidden;background:var(--paper);border:1px solid #e5ebe4;border-radius:32px;box-shadow:var(--shadow)}
.prelude:before{content:"";position:absolute;width:250px;height:250px;right:-100px;top:-122px;border-radius:50%;background:radial-gradient(circle,#f4e2bd80,transparent 70%);pointer-events:none}
.prelude-top{display:flex;align-items:center;gap:12px;position:relative}.prelude-icon{width:48px;height:48px;border-radius:17px;background:#fff3e5;border:1px solid #f5e6d5;display:grid;place-items:center;font-size:23px}.prelude-kicker{color:#9aa9a0;font-size:10px;letter-spacing:.17em}.prelude-title{font:700 clamp(29px,5vw,42px)/1.35 "STKaiti","KaiTi","Songti SC",serif;color:#304f55;letter-spacing:.02em;margin:25px 0 11px}.prelude-title em{font-style:normal;color:#d7895d}.prelude-copy{margin:0;color:#82938e;font:14px/1.9 "STKaiti","KaiTi","Songti SC",serif}.stress-label{display:flex;justify-content:space-between;gap:12px;margin:27px 0 9px;color:#59736c;font-size:12px;font-weight:650}.stress-label small{color:#a2ada6;font-size:10px;font-weight:400}.stress-note{display:block;width:100%;min-height:135px;resize:vertical;border:1px solid #e4e9df;border-radius:17px;background:#fbfcf7;padding:15px 16px;color:#405a56;font:14px/1.8 "PingFang SC","Microsoft YaHei",sans-serif;outline:none;transition:.2s}.stress-note::placeholder{color:#b0bbb2}.stress-note:focus{border-color:#c2d3be;background:#fff;box-shadow:0 0 0 4px #dcebd65c}.prelude-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:15px}.char-count{color:#a5b0a8;font-size:10px;font-variant-numeric:tabular-nums}.start-game{border:0;border-radius:99px;padding:13px 20px;background:#d8895d;color:#fffaf1;box-shadow:0 4px 0 #bf744f;font-weight:700;font-size:12px;cursor:pointer;transition:.2s}.start-game:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 #bf744f}.start-game:disabled{background:#e7eae3;color:#a6b0a6;box-shadow:0 4px 0 #dce2d9;cursor:not-allowed}.privacy-note{margin:21px 0 0;color:#9ca9a0;font-size:10px;line-height:1.7}.play-area[hidden],.prelude[hidden]{display:none!important}
.shell.is-melting .sun{box-shadow:0 0 0 18px #ffe9b545,0 0 65px #ffdc9bb8}
.shell.is-melting .scene{background:linear-gradient(180deg,#d9eff0 0%,#f3f0df 61%,#f1e8d0 100%)}
.shell.is-melting .crack{opacity:var(--crack,0)}
.shell.is-melting .chip{opacity:var(--chip,0);transform:translateY(7px)}
.shell.is-melting .plant{opacity:1;transform:translateY(0)}
.shell.is-done .scene{background:linear-gradient(180deg,#d9eff0 0%,#f4edda 61%,#f0e4ca 100%)}
.shell.is-done .sun{box-shadow:0 0 0 18px #ffe9b545,0 0 65px #ffdc9bb8}
.shell.is-done .ice-group{opacity:0;transform:scaleY(.02) scaleX(.3)}
.shell.is-done .puddle{transform:scale(1.16,1.08);fill:#85c9cb}
.shell.is-done .ending{opacity:1;transform:translateY(0)}
.shell.is-done .scene-status{opacity:0}
.shell.is-done .plant{opacity:1;transform:translateY(-5px) scale(1.12)}
@keyframes flame{from{transform:rotate(-3deg) scale(.97,1)}to{transform:rotate(3deg) scale(1.04,.98)}}
@keyframes aurora{from{transform:translateX(-2%) scale(1)}to{transform:translateX(3%) scale(1.06)}}
@keyframes drift{0%,100%{transform:translateY(-2px) rotate(0)}50%{transform:translateY(9px) rotate(14deg)}}
@keyframes drip{0%,100%{opacity:.15;transform:translateY(-4px)}50%{opacity:.9;transform:translateY(5px)}}
@media(max-width:760px){body{padding:14px 12px 22px;place-items:start center}.topbar{margin-bottom:13px}.layout{grid-template-columns:1fr;gap:12px}.scene-card{padding:9px;border-radius:24px}.scene{height:min(66vh,490px);min-height:385px;border-radius:17px}.art{width:min(83%,355px);top:80px}.scene-head{top:17px;left:18px}.scene-title{font-size:15px}.weather{top:17px;right:16px}.side-card{padding:21px 22px 18px;border-radius:24px}.side-card h1{font-size:32px;margin:9px 0 6px}.intro{font-size:13px}.divider{margin:15px 0 13px}.message{min-height:55px;margin-top:12px}.stats{padding-top:15px}.footer-note{margin-top:14px}.torch-button{bottom:18px}.scene-status{bottom:83px}}
@media(max-width:760px){.prelude{margin:4vh auto 0;border-radius:26px;padding:26px 22px}.prelude-title{margin:19px 0 8px}.prelude-copy{font-size:13px}.stress-label{margin-top:22px}.stress-note{min-height:125px}.prelude-actions{align-items:flex-end}.privacy-note{margin-top:17px}}
@media(max-width:390px){.top-actions .icon-button{padding:8px 10px}.brand-copy b{font-size:15px}.brand-mark{width:37px;height:37px}.scene{min-height:360px}.weather{font-size:9px;padding:6px 8px}.art{top:68px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<style>#iceGroup{cursor:pointer;pointer-events:visiblePainted;touch-action:manipulation;transition:transform .18s ease,opacity .6s}#iceGroup:active{filter:brightness(1.12)}.torch-button{display:none}</style>
</head>
<body>
<main class="shell" id="game" style="--heat:0;--crack:0;--chip:0">
  <section class="prelude" id="prelude" aria-labelledby="preludeTitle" hidden>
    <div class="prelude-top"><div class="prelude-icon" aria-hidden="true">✍️</div><div class="prelude-kicker">A SOFT PLACE TO BEGIN</div></div>
    <h1 class="prelude-title" id="preludeTitle">开始融冰前，<br><em>先把压力放下来一点。</em></h1>
    <p class="prelude-copy">有什么事压在心上？写一句、几个词也可以。<br>冰块上还会随机刻着几件烦心事，陪你一起慢慢化开。</p>
    <label class="stress-label" for="stressNote">此刻，我最在意的是……<small>写一点点就好</small></label>
    <textarea class="stress-note" id="stressNote" maxlength="300" rows="4" placeholder="比如：最近总觉得有很多事要做，却不知道从哪件开始。&#10;&#10;也可以只写几个词……"></textarea>
    <div class="prelude-actions"><span class="char-count" id="charCount" aria-live="polite">0 / 300</span><button class="start-game" id="startGame" type="button" disabled>写好了，去暖一暖　→</button></div>
    <p class="privacy-note">🔒 这段文字不会上传或保存。进入游戏后会自动清空。</p>
  </section>
  <div class="play-area" id="playArea" aria-hidden="false">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">🕯️</div><div class="brand-copy"><b>暖一小会儿</b><span>A LITTLE MELT · A LITTLE CALM</span></div></div>
    <div class="top-actions"><button class="icon-button" id="soundToggle" type="button" aria-pressed="false">♪ 音效关</button><button class="icon-button" id="resetTop" type="button" aria-label="重新开始">↻ 重来</button></div>
  </header>
  <div class="layout">
    <section class="scene-card" aria-label="融冰游戏场景">
      <div class="scene" id="scene">
        <div class="aurora"></div><div class="sun"></div>
        <div class="scene-head"><div class="scene-kicker">NORTH POLE · SLOW MOMENT</div><div class="scene-title">给冬天一点点温柔</div></div>
        <div class="weather">❄　微雪 · 很安静</div>
        <div class="cloud"></div><div class="cloud two"></div>
        <span class="snowflake s1">✳</span><span class="snowflake s2">✦</span><span class="snowflake s3">✳</span>
        <div class="warmth" aria-hidden="true"></div>
        <div class="hill back"></div><div class="hill far"></div><div class="hill"></div>
        <svg class="art" viewBox="0 0 380 340" role="img" aria-label="一块正在融化的冰">
          <ellipse class="ice-shadow" cx="190" cy="280" rx="112" ry="22"/>
          <ellipse class="puddle" cx="190" cy="276" rx="96" ry="16"/>
          <path class="puddle-shine" d="M125 276c13-5 24-5 36-2M222 277c10-4 18-4 28-2"/>
          <g class="ice-group" id="iceGroup">
            <path d="M108 246 113 128 150 77 253 86 277 137 268 247 225 267 145 259Z" fill="#a9dce1" stroke="#f5ffff" stroke-width="4" stroke-linejoin="round"/>
            <path class="ice-facet" d="m113 128 37-51 11 88-46 81z"/>
            <path class="ice-facet2" d="m161 165 92-79 24 51-9 110-43 20z"/>
            <path d="m150 77 103 9-92 79z" fill="#edffff" opacity=".7"/>
            <path d="m161 165 107-28-9 110-43 20z" fill="#70becb" opacity=".33"/>
            <path class="ice-line" d="m150 92 9 73m17-62 49 22m-99 29 31 11m-17 82 45-42 45 41"/>
            <path class="crack" d="m170 112-13 25 16 12-11 21 15 15-8 19m49-76 13 18-16 13 10 17-12 20m-92-21 21 13-6 18 18 15"/>
            <path class="chip" d="m112 128 23 5-20 20zm139-42-9 25 25-10z"/>
            <circle class="drip" cx="147" cy="260" r="5" fill="#70c3ce"/><circle class="drip" cx="226" cy="269" r="4" fill="#70c3ce"/><circle class="drip" cx="259" cy="251" r="3.5" fill="#70c3ce"/>
            <g class="engravings" id="engravings" aria-hidden="true"></g>
          </g>
          <g transform="translate(184 247)"><g class="plant"><path d="M7 29c1-12 2-21 1-28" stroke="#77a783" stroke-width="3" fill="none" stroke-linecap="round"/><path class="plant-leaf" d="M8 17C-8 18-12 7-8 3 1 3 7 8 8 17Zm1-7C8-1 18-5 23-1c1 8-5 13-14 11Z"/><path class="plant-flower" d="M7-2c2-7 8-5 7 0 6-5 11 0 6 4 7 2 4 9-2 7 1 7-7 8-9 2-5 4-11 0-7-5-5-5-1-10 5-8z" transform="translate(-1 -4) scale(.55)"/></g></g>
        </svg>
        <div class="scene-status" id="sceneStatus">冰块还在打盹呢　<span>❄</span></div>
        <div class="ending" aria-live="polite"><b>融成一汪清水啦</b><span>小小的温暖，也能慢慢改变什么。</span></div>
        <button class="torch-button" id="torch" type="button" aria-label="点击火把融化冰块；按住可以持续加温">
          <svg viewBox="0 0 34 38" aria-hidden="true"><path d="M11 18 22 18 27 35 7 35z" fill="#9e694b"/><path d="m10 21 13 0m-11 5 14 0m-13 5 15 0" stroke="#d39a6b" stroke-width="2" stroke-linecap="round"/><path class="torch-flame" d="M17 19C5 14 13 6 17 1c1 6 10 8 7 15-1 2-4 3-7 3z" fill="#ee975c"/><path class="torch-flame" d="M17 17c-5-4 0-8 2-10 0 4 4 5 2 9-1 2-3 2-4 1z" fill="#ffe0a0"/></svg>
          <span class="torch-copy">点一下火把<small>点击加温 · 按住连续融化</small></span>
        </button>
      </div>
    </section>
    <aside class="side-card compact-card">
      <div class="compact-heading"><div><div class="eyebrow">融化进度</div><h2>给自己一点暖意</h2></div><strong id="percent">0%</strong></div>
      <div class="progress-track" id="progress" role="progressbar" aria-label="冰块融化进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      <div class="message" id="message" aria-live="polite"><strong>快速点击冰块</strong>停得太久会重新凝固。</div>
      <div class="compact-stats"><div><span>今天融化</span><b id="count">0 块冰</b></div><div><span>点击冰块</span><b id="taps">0 次</b></div></div>
    </aside>
  </div>
  </div>
</main>
<script>
(()=>{
  const game=document.getElementById('game');
  const prelude=document.getElementById('prelude');
  const playArea=document.getElementById('playArea');
  const stressNote=document.getElementById('stressNote');
  const startGame=document.getElementById('startGame');
  const charCount=document.getElementById('charCount');
  const torch=document.getElementById('torch');
  const progress=document.getElementById('progress');
  const fill=document.getElementById('progressFill');
  const percent=document.getElementById('percent');
  const message=document.getElementById('message');
  const status=document.getElementById('sceneStatus');
  const tapLabel=document.getElementById('taps');
  const soundToggle=document.getElementById('soundToggle');
  let melt=0,taps=0,holdTimer=null,holdTimeout=null,audio=null,sound=false,finished=false,started=true;
  const today=new Date(),dayKey=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
  let meltedToday=0;
  try{if(localStorage.getItem('little-melt-date')===dayKey)meltedToday=Number(localStorage.getItem('little-melt-count')||0)}catch(_){/* Storage is optional. */}
  const count=document.getElementById('count');
  const messages=[
    [0,'此刻，万物都慢慢的','连续点击冰块，让暖意一点点留下。','连续点击，别让冰块重新凝固　❄'],
    [1,'听见冰面轻轻响了','第一道细细的裂纹，出现啦。','咔嚓——冰面松动了一点'],
    [23,'暖意正好抵达这里','边角开始变圆，水珠悄悄落下。','有一滴水，逃出冰块啦　💧'],
    [52,'冰块正在变得柔软','不用着急，温暖已经做了很多。','看，冰块变小了好多'],
    [82,'最后一点点冰','剩下的，就交给这份温暖吧。','快融化成清水啦　✨'],
    [100,'融成一汪清水啦','小小的温暖，也能慢慢改变什么。','一块冰，安静地融化了　🌱']
  ];
  const worries=['工作压力','学业焦虑','截止日期','房租账单','人际关系','害怕落后','总在比较','睡不好觉','未来发愁','消息太多','时间不够','期待太多','没有力气','社交疲惫','钱不够用','计划赶不上','担心家人','做不完的事','怕让人失望','选择困难'];
  function refreshEngravings(){
    const group=document.getElementById('engravings');
    const shuffled=[...worries].sort(()=>Math.random()-.5);
    const rows=[{x:215,y:194,a:-14},{x:221,y:217,a:-14},{x:220,y:239,a:-14}];
    group.replaceChildren(...rows.map((row,i)=>{
      const word=shuffled[i],text=document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('class','engraving');text.setAttribute('text-anchor','middle');
      text.setAttribute('x',row.x);text.setAttribute('y',row.y);
      text.setAttribute('font-size',word.length>4?'10':'11.5');
      text.setAttribute('transform',`rotate(${row.a} ${row.x} ${row.y})`);
      text.textContent=word;return text;
    }));
  }
  function draw(){
    const n=Math.round(melt);
    percent.textContent=n+'%';fill.style.width=n+'%';progress.setAttribute('aria-valuenow',n);
    tapLabel.textContent=taps+' 次';count.textContent=meltedToday+' 块冰';
    const scaleY=Math.max(.28,1-melt*.0065),scaleX=Math.max(.72,1-melt*.0021);
    document.getElementById('iceGroup').style.transform=`scale(${scaleX},${scaleY})`;
    game.style.setProperty('--heat',String(melt/100));
    game.style.setProperty('--crack',String(Math.min(1,Math.max(0,(melt-12)/24))));
    game.style.setProperty('--chip',String(Math.min(1,Math.max(0,(melt-35)/18))));
    const item=[...messages].reverse().find(x=>melt>=x[0])||messages[0];
    if(started&&melt===0){message.innerHTML='<strong>快速点击冰块</strong>停得太久会重新凝固，让暖意连续留在冰面上。';status.innerHTML='<b>连续点击，让冰块慢慢融化</b>'}
    else{message.innerHTML='<strong>'+item[1]+'</strong>'+item[2];status.innerHTML='<b>'+item[3]+'</b>'}
    game.classList.toggle('is-melting',melt>0&&melt<100);
    game.classList.toggle('is-done',melt>=100);
  }
  function chime(){
    if(!sound)return;
    try{
      audio=audio||new (window.AudioContext||window.webkitAudioContext)();
      if(audio.state==='suspended')audio.resume();
      const osc=audio.createOscillator(),gain=audio.createGain();
      osc.type='sine';osc.frequency.setValueAtTime(523+Math.random()*130,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(330,audio.currentTime+.16);
      gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.22);
      osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.23);
    }catch(_){/* Audio is optional; the game remains playable without it. */}
  }
  function warm(amount,quiet=false){
    if(melt>=100)return;
    melt=Math.min(100,melt+amount);taps++;torch.classList.add('heating');
    window.clearTimeout(window._warmFx);window._warmFx=window.setTimeout(()=>torch.classList.remove('heating'),180);
    if(!quiet)chime();
    if(melt===100&&!finished){finished=true;meltedToday++;try{localStorage.setItem('little-melt-date',dayKey);localStorage.setItem('little-melt-count',String(meltedToday))}catch(_){/* Storage is optional. */}if(window.parent!==window)window.parent.postMessage({type:'emotion-forest-game-complete',game:'ice'},'*')}
    draw();
  }
  function stopHold(){clearInterval(holdTimer);clearTimeout(holdTimeout);holdTimer=null;holdTimeout=null;torch.classList.remove('heating');}
  torch.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();warm(4);
    try{torch.setPointerCapture(e.pointerId)}catch(_){ }
    holdTimeout=setTimeout(()=>{holdTimer=setInterval(()=>warm(1.2,true),95)},260);
  });
  torch.addEventListener('pointerup',stopHold);torch.addEventListener('pointercancel',stopHold);torch.addEventListener('lostpointercapture',stopHold);
  torch.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)warm(4)}});
  const iceGroup=document.getElementById('iceGroup');
  iceGroup.setAttribute('tabindex','0');iceGroup.setAttribute('role','button');iceGroup.setAttribute('aria-label','快速点击冰块使它融化');
  iceGroup.addEventListener('pointerdown',e=>{e.preventDefault();warm(8)});
  iceGroup.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();warm(8)}});
  setInterval(()=>{if(finished||melt<=0)return;melt=Math.max(0,melt-.7);draw()},180);
  function reset(){stopHold();melt=0;taps=0;finished=false;refreshEngravings();draw();}
  document.getElementById('resetTop').addEventListener('click',reset);
  soundToggle.addEventListener('click',()=>{sound=!sound;soundToggle.textContent=sound?'♪ 音效开':'♪ 音效关';soundToggle.setAttribute('aria-pressed',String(sound));if(sound)chime()});
  stressNote.addEventListener('input',()=>{
    charCount.textContent=Array.from(stressNote.value).length+' / 300';
    startGame.disabled=!stressNote.value.trim();
  });
  startGame.addEventListener('click',()=>{
    if(!stressNote.value.trim()){stressNote.focus();return}
    stressNote.value='';charCount.textContent='0 / 300';started=true;
    prelude.hidden=true;playArea.hidden=false;playArea.setAttribute('aria-hidden','false');refreshEngravings();draw();
    torch.focus({preventScroll:true});
  });
  prelude.hidden=true;playArea.hidden=false;playArea.setAttribute('aria-hidden','false');refreshEngravings();draw();
})();
</script>
</body>
</html>

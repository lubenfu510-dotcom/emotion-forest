radius:999px;background:rgba(255,253,247,.48);padding:9px 11px;font-size:10px;font-weight:800;color:#555b72}.home-tree-btn{height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.68);border-radius:15px;background:#dcefc8;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:11px;font-weight:900;color:#3e624c;box-shadow:0 4px 12px rgba(67,60,109,.08)}.home-video-card{height:clamp(390px,64dvh,535px);position:relative;margin:4px -3px 16px;border-radius:30px;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,#fbf3d9 0,transparent 60%),linear-gradient(155deg,#ebe6f7,#e3efeb);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 28px rgba(66,61,120,.12);display:grid;place-items:center}.home-video-card video{display:block;width:100%;height:100%;padding:10px;object-fit:contain;object-position:center;background:transparent}.home-copy{padding:0 12px;text-align:center}.home-copy h1{font-size:clamp(29px,8vw,36px);line-height:1.25;letter-spacing:.01em;margin:0 0 8px}.home-copy p{font-size:14px;line-height:1.65;color:#65687c;margin:0 auto;max-width:310px}.home-cta{margin-top:17px}.home-cta .btn{min-height:60px;font-size:16px;border-radius:22px}.home-note{text-align:center;color:#78798e;font-size:12px;margin:13px 0 2px}@media(max-width:390px){.home-tree-btn{padding:0 9px;font-size:10px}.home-video-card{height:clamp(360px,60dvh,470px)}.home-copy h1{font-size:28px}}

.game-kicker{display:flex;justify-content:space-between;align-items:center;margin:3px 0 8px;font-size:10px;font-weight:900;color:#68748a}.game-kicker span:last-child{padding:5px 9px;border-radius:999px;background:#fffdf7b8}.ice-game-pro{height:267px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at 50% 92%,#ffe0a7 0,transparent 42%),linear-gradient(160deg,#cfeef5,#e9f4ec 63%,#f9eed8);isolation:isolate}.ice-game-pro:before{content:"";position:absolute;width:150px;height:150px;right:-40px;top:-52px;border-radius:50%;background:#fff0bf8c;filter:blur(3px)}.ice-moon{position:absolute;right:22px;top:19px;width:31px;height:31px;border-radius:50%;background:#fff3ba;box-shadow:0 0 0 10px #fff0b33d,0 0 24px #ffe49c}.ice-iceberg{position:absolute;left:50%;bottom:37px;width:138px;height:143px;transform:translateX(-50%) translateY(var(--ice-drop,0px)) scale(var(--ice-scale,1));opacity:var(--ice-opacity,1);border-radius:31px 27px 35px 30px;background:linear-gradient(135deg,#ffffffef 3%,#c7f0f3 42%,#74c3d1 100%);border:2px solid #efffff;box-shadow:inset 10px 9px 19px #fff9,inset -9px -11px 18px #3b94ad3d,0 16px 21px #4b8a9e28;transition:transform .22s ease,opacity .28s ease;z-index:3;display:grid;place-items:center;padding:18px}.ice-iceberg:before{content:"";position:absolute;inset:12px 17px auto;width:42px;height:72px;border-radius:18px;background:linear-gradient(180deg,#fff9,transparent);transform:rotate(16deg)}.ice-iceberg.cracked:after{content:"";position:absolute;inset:15px;background:linear-gradient(118deg,transparent 43%,#fff 44%,transparent 46%),linear-gradient(66deg,transparent 48%,#f9ffff 49%,transparent 51%);opacity:.8}.ice-words{position:relative;z-index:1;max-height:76px;overflow:hidden;color:#386878;text-align:center;font-size:13px;line-height:1.45;font-weight:900;text-shadow:0 1px #fff}.ice-puddle{position:absolute;z-index:2;bottom:30px;left:50%;width:160px;height:22px;border-radius:50%;background:#63bdce8c;filter:blur(5px);transform:translateX(-50%) scaleX(var(--puddle,0));transition:transform .25s}.ice-heat{position:absolute;z-index:4;left:50%;bottom:18px;transform:translateX(-50%);width:225px;height:112px;background:radial-gradient(ellipse,#ffc1767d,transparent 67%);opacity:var(--heat,0);filter:blur(7px);pointer-events:none}.ice-torch{position:absolute;z-index:6;left:50%;bottom:13px;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 17px;background:#fff7dc;color:#925d43;box-shadow:0 5px 0 #e9c485,0 10px 20px #704d3120;font-size:12px;font-weight:900;touch-action:none;user-select:none}.ice-torch:active,.ice-torch.heating{transform:translateX(-50%) translateY(4px) scale(.98);box-shadow:0 2px 0 #e9c485,0 6px 12px #704d3120}.ice-torch b{font-size:21px;vertical-align:-2px;margin-right:5px}.ice-done{position:absolute;inset:0;z-index:7;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.35s;background:#fff6cf28}.ice-game-pro.done .ice-done{opacity:1}.ice-done strong{display:block;font-size:21px}.ice-done span{font-size:11px;color:#57747a}.game-progress{height:8px;border-radius:99px;background:#ffffffa8;overflow:hidden;margin:10px 2px 6px}.game-progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#f0bc72,#df825e);transition:width .22s}.game-tip{min-height:30px;margin:7px 2px 0;font-size:11px;line-height:1.5;color:#6d7587}.game-write{margin-top:10px}.game-write .textarea{min-height:76px;font-size:13px}.game-write .btn{margin-top:9px}
.fan-game{height:288px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at 50% 102%,#d3e5a8 0,transparent 42%),linear-gradient(180deg,#badff3,#d5efec 64%,#eef1c9);isolation:isolate}.fan-game:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 74% 17%,#fff1a8 0 7%,transparent 7.4%),linear-gradient(105deg,transparent 47%,#fff9 48% 49%,transparent 50%) 8px 28px/60px 60px;opacity:.54}.fan-cloud{position:absolute;z-index:4;width:82px;height:36px;border:0;border-radius:99px;background:linear-gradient(180deg,#8fa3bc,#617993);box-shadow:inset 4px 5px 8px #bdccdc33,0 8px 11px #4660782b;color:#f5f8fb;font-size:10px;font-weight:900;text-shadow:0 1px 2px #4a6179;touch-action:manipulation;transition:opacity .22s,filter .22s}.fan-cloud:before,.fan-cloud:after{content:"";position:absolute;border-radius:50%;background:inherit;z-index:-1}.fan-cloud:before{width:37px;height:37px;left:12px;top:-13px}.fan-cloud:after{width:28px;height:28px;right:11px;top:-8px}.fan-cloud.c0{left:5%;top:28px}.fan-cloud.c1{right:5%;top:39px}.fan-cloud.c2{left:-2%;top:107px}.fan-cloud.c3{right:-1%;top:119px}.fan-cloud.c4{left:8%;bottom:49px}.fan-cloud.c5{right:8%;bottom:52px}.fan-cloud.flying{animation:fan-fly .75s cubic-bezier(.18,.72,.26,1) forwards;pointer-events:none}.fan-cloud.gone{display:none}.fan-wind{position:absolute;z-index:3;inset:0;opacity:0;pointer-events:none;background:repeating-linear-gradient(8deg,transparent 0 20px,#ffffffa8 21px 25px,transparent 27px 44px);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);transform:translateX(-18%)}.fan-game.blowing .fan-wind{animation:fan-wind .58s ease-out both}.fan-core{position:absolute;z-index:5;left:50%;bottom:30px;width:102px;height:102px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#f9f2cf 0 11%,#efb96e 12% 15%,transparent 16%),conic-gradient(from 0deg,#ffcc83 0 15%,transparent 15% 33%,#f6b46d 33% 48%,transparent 48% 66%,#ffd489 66% 81%,transparent 81%);filter:drop-shadow(0 10px 7px #5e746230);border:0;cursor:pointer;touch-action:manipulation}.fan-core:after{content:"";position:absolute;inset:41px;border-radius:50%;background:#fff4c5;box-shadow:0 0 0 5px #e99d63}.fan-core.spinning{animation:fan-spin .55s linear}.fan-base{position:absolute;z-index:2;left:50%;bottom:13px;width:80px;height:50px;transform:translateX(-50%);border-radius:50% 50% 20px 20px;background:#f4c37e;box-shadow:inset 0 -6px #d99464}.fan-status{position:absolute;z-index:6;left:50%;bottom:10px;transform:translateX(-50%);width:235px;text-align:center;color:#5f7481;font-size:11px;font-weight:800;pointer-events:none}.fan-finish{position:absolute;z-index:9;inset:0;display:grid;place-items:center;text-align:center;background:#fff9cf42;opacity:0;pointer-events:none;transition:.3s}.fan-finish strong{display:block;font-size:21px;color:#4f8272}.fan-finish span{font-size:11px;color:#648d7c}.fan-game.done .fan-finish{opacity:1}@keyframes fan-fly{to{opacity:0;transform:translate(var(--fly-x,120px),var(--fly-y,-60px)) rotate(var(--fly-r,15deg)) scale(.35);filter:blur(5px)}}@keyframes fan-spin{to{transform:translateX(-50%) rotate(540deg)}}@keyframes fan-wind{0%{opacity:0;transform:translateX(-35%)}30%{opacity:.78}100%{opacity:0;transform:translateX(25%)}}
/* Dance, voice and ambient sound activities */
 .dance-stage{height:194px;border-radius:22px;margin:10px 0;background:radial-gradient(ellipse at 50% 100%,#d3f2c8,#eaf1de 50%,#f9e5f0);position:relative;overflow:hidden;display:grid;place-items:center}.dance-person{font-size:75px;filter:drop-shadow(0 10px 10px #39455b25);animation:dance-bop .58s ease-in-out infinite alternate}.dance-stage.paused .dance-person{animation-play-state:paused}.dance-tip{position:absolute;top:13px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#ffffffc9;font-size:11px;font-weight:900;white-space:nowrap}.dance-spark{position:absolute;color:#f6c957;font-size:18px;animation:twinkle 1.4s infinite}.dance-spark.a{left:22%;top:40%}.dance-spark.b{right:23%;top:28%;animation-delay:.6s}.dance-progress{height:7px;background:#fff;border-radius:9px;overflow:hidden;margin:8px 0}.dance-progress span{display:block;height:100%;background:#b6df6c;border-radius:inherit;transition:width .5s}.shout-wave{height:76px;display:flex;align-items:center;justify-content:center;gap:5px;margin:14px 0}.shout-wave i{display:block;width:5px;height:18px;border-radius:5px;background:linear-gradient(#ae91e9,#75d6c2);animation:wave-bar .65s ease-in-out infinite alternate}.shout-wave i:nth-child(3n){animation-delay:-.4s}.shout-wave i:nth-child(2n){animation-delay:-.2s}.shout-wave.paused i{animation-play-state:paused}.noise-volume{width:100%;accent-color:#91c951;margin:12px 0 2px}.noise-names{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.noise-choice{border:1px solid #e9e6ee;background:#fff;border-radius:14px;padding:9px 6px;font-size:10px;font-weight:800}.noise-choice.selected{background:#e2f7cd;border-color:#cae9a9}@keyframes dance-bop{from{transform:rotate(-10deg) translateY(3px)}to{transform:rotate(10deg) translateY(-8px)}}@keyframes wave-bar{from{height:12px;opacity:.6}to{height:58px;opacity:1}}
/* Emotional forest companion: animated healing scene above contextual chat */

function header(){let right='';if(state.page==='home')right=`<button class="home-tree-btn" onclick="setPage('tree','home')"><span>🌳</span>我的情绪树</button><button class="icon-btn" aria-label="设置" onclick="showSheet('settings')">☀</button>`;else if(state.page==='think')right=`<button class="archive-text-btn" aria-label="关于我" onclick="setPage('archive','think')"><span>🗂</span>关于我</button>`;else if(['talk','result','tree','archive','summary','achievements','moreTrees'].includes(state.page))right=`<button class="icon-btn" aria-label="返回" onclick="goBack()">‹</button>`;else right=`<button class="icon-btn" aria-label="结束" onclick="showSheet('leave')">×</button>`;$('#topbar').innerHTML=`<div class="brand"><span class="brand-mark">🌱</span><span>情绪小树林</span></div><div class="top-actions">${right}</div>`}
function nav(){const active=state.tab;const items=[['home','☁','想聊聊'],['vent','✦','要宣泄'],['think','♡','想清楚']];$('#bottom-nav').innerHTML=items.map(([id,icon,label])=>`<button class="tab ${active===id?'active':''}" onclick="navigate('${id}')"><span class="tab-icon">${icon}</span><span>${label}</span></button>`).join('')}
function intro(scene=true){return `${scene?`<div class="home-video-card" onpointermove="tiltVideo(event)" onpointerleave="resetVideo()"><video autoplay muted loop playsinline preload="metadata" aria-label="森林与陪伴动画"><source src="./assets/home-video-new.mp4" type="video/mp4"></video></div>`:''}<div class="home-copy"><h1>今天心里，<br>有一点什么吗？</h1><p>不用组织好，慢慢说。<br>我会在这里听着。</p></div>`}
function pageHome(){return `${intro()}<div class="home-cta"><button class="btn btn-primary full" onclick="setPage('talk','home')">开始倾诉 <span>→</span></button></div><p class="home-note">把烦恼先放在这里吧 ♡</p>`}
function pageTalk(){return `<section class="talk-dialogue"><div class="talk-guidance"><span class="leaf">🌿</span><div><strong>先把心里的话，放在这里</strong><small>不用讲得完整，也不用着急找到答案。</small></div></div><textarea id="talk-text" class="textarea" placeholder="点这里打字，慢慢写下你想说的话……" oninput="state.talk=this.value">${esc(state.talk)}</textarea></section><div class="talk-actions"><button class="btn btn-outline full voice-button ${state.voiceActive?'listening':''}" onclick="toggleTalkVoice()">${state.voiceActive?'■ 停止语音输入':'🎙 开始倾诉'}</button><button class="btn btn-primary full talk-send" onclick="finishTalk()">讲完了</button></div>`}
function pageResult(){const level=state.level||'轻度';const moodLabel=({good:'舒缓',sad:'悲伤',lonely:'孤独',anxious:'焦虑',angry:'生气',rage:'愤怒',lost:'迷茫'})[state.emotion]||'焦虑';const art=({good:'./assets/emotion-good.jpg',sad:'./assets/emotion-sad.png',lonely:'./assets/emotion-lonely.jpg',anxious:'./assets/emotion-anxious.jpg',angry:'./assets/emotion-angry.png',rage:'./assets/emotion-angry.png'})[state.emotion]||'';const visual=art?`<img class="result-emotion-image" src="${art}" alt="${moodLabel}的场景">`:seedlingSvg();return `<div class="result-page"><h1>我听见了。</h1><p class="result-lead">刚才的事情让你消耗了很多，<br>这不是你不好。</p><div class="mood-stage">${visual}</div><span class="result-mood-pill">${moodLabel} | ${level}</span><p class="result-question">现在，你想先把情绪放下来，<br>还是陪自己想清楚？</p><div class="result-actions"><button class="result-choice vent" onclick="showSheet('blindbox')"><strong>要纾解</strong><small>打开一个情绪盲盒</small></button><button class="result-choice think" onclick="setPage('think','think')"><strong>想清楚</strong><small>让情绪搭子陪你</small></button></div><p class="result-footnote">慢一点，也是在往前走。</p></div>`}
function pageVent(){const m=modes[state.mode];return `<div style="padding-top:4px"><span class="eyebrow">给情绪一个出口</span><h1 class="page-title" style="margin-bottom:4px">要宣泄</h1><p class="page-sub">笑一笑，闹一闹也挺好。<br>选一个现在用得上的方式。</p></div><div class="mode-wrap"><button class="switch-arrow" aria-label="上一种" onclick="changeMode(-1)">‹</button><article class="mode-card" style="--mode-bg:${m.bg}"><div class="mode-illustration">${m.icon}</div><h2>${m.name}</h2><p>${m.desc}</p><div class="mode-detail">${m.how}</div><button class="btn btn-dark full btn-small" onclick="startActivity()">开始体验 <span>→</span></button></article><button class="switch-arrow" aria-label="下一种" onclick="changeMode(1)">›</button></div><div class="dots">${modes.map((x,i)=>`<i class="dot ${i===state.mode?'active':''}"></i>`).join('')}</div><p class="tiny-note">你可以随时暂停、退出或换一个，不用勉强。</p><div class="soft-card" style="margin-top:21px;display:flex;align-items:center;gap:10px"><span style="font-size:20px">🌱</span><span class="helper">如果你更想聊聊，或把问题理清，也可以直接切换下面的导航。</span></div>`}
function renderIceGame(){const p=state.iceProgress;const scale=Math.max(.23,1-p*.0068),opacity=Math.max(0,1-p*.011),message=p>=100?'暖意已经留下来了。':p>78?'最后一点点冰，慢慢来。':p>44?'冰面开始变软，呼吸也可以慢一点。':p>12?'听见冰面轻轻响了。':'快速点击冰块，让温暖一点点留下来。';return `<div class="game-kicker"><span>暖一小会儿</span><span id="ice-taps">${state.iceTaps} 次点击</span></div><div class="ice-game-pro ${p>=100?'done':''}" id="ice-game-pro" style="--heat:${Math.min(.7,.13+p/145)};--puddle:${Math.min(1,p/100)}"><i class="ice-moon"></i><div class="ice-puddle" id="ice-puddle" style="--puddle:${Math.min(1,p/100)}"></div><div class="ice-heat" id="ice-heat" style="--heat:${Math.min(.8,.16+p/125)}"></div><div class="ice-iceberg ${p>12?'cracked':''}" id="ice-cube-pro" role="button" tabindex="0" aria-label="快速点击融化冰块" onclick="warmIce(8)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();warmIce(8)}" style="--ice-scale:${scale};--ice-opacity:${opacity};--ice-drop:${p*.42}px"><span class="ice-words" id="ice-words" style="opacity:${Math.max(0,1-p/82)}">${esc(state.iceText)}</span></div><div class="ice-done"><div><strong>融成一汪清水啦</strong><span>小小的温暖，也能慢慢改变什么。</span></div></div></div><div class="game-progress"><i id="ice-progress" style="width:${p}%"></i></div><p class="game-tip" id="ice-tip">${message}</p><div class="btn-row"><button class="btn btn-soft btn-small" onclick="finishActivity()">先到这里</button></div>`}
function renderFanGame(){const left=state.blowClouds.length-state.blowCleared.length,percent=Math.round(state.blowCleared.length/state.blowClouds.length*100);const clouds=state.blowClouds.map((word,index)=>`<button class="fan-cloud c${index} ${state.blowCleared.includes(index)?'gone':''}" data-cloud="${index}" onclick="fanBlow(${index})">${esc(word)}</button>`).join('');return `<div class="game-kicker"><span>乌云小风扇</span><span id="fan-count">还剩 ${left} 朵</span></div><div class="fan-game ${left===0?'done':''}" id="fan-game"><div class="fan-wind"></div>${clouds}<div class="fan-base"></div><button class="fan-core" id="fan-core" type="button" aria-label="转动小风扇吹走乌云" onclick="fanBlow()"></button><div class="fan-status" id="fan-status">${left===0?'晴天来啦，真好！':state.blowStarted?'点乌云或风扇，让风吹走一朵。':'先启动风扇，再轻轻吹走一朵。'}</div><div class="fan-finish"><div><strong>天空放晴啦</strong><span>今天也做得很好。</span></div></div></div><div class="game-progress"><i id="fan-progress" style="width:${percent}%;background:linear-gradient(90deg,#84d9bd,#c4ec72)"></i></div><p class="game-tip" id="fan-tip">${state.blowMicActive?'正在感受环境音量；不会录音。':state.blowStarted?'每一阵风，都只吹走一小朵。':'支持手指点击；也可开启麦克风，用自然呼吸推动云朵。'}</p><div class="btn-row"><button class="btn btn-primary btn-small" onclick="${state.blowStarted?'pauseBlowGame()':'startBlowGame()'}">${state.blowStarted?'暂停风扇':'启动小风扇'}</button><button class="btn btn-outline btn-small" onclick="resetBlowGame()">重新开始</button></div>`}
function pageActivity(){const i=state.activityMode;let body='';if(i===0){const steps=['甩一甩','抖抖肩','跺跺脚','动作不用标准'];body=`<div class="dance-stage ${state.activityStarted?'':'paused'}"><video id="dance-video" class="dance-video" src="./assets/dance-video.mp4" poster="./assets/dance-poster.jpg" playsinline preload="metadata" onloadedmetadata="setDanceDuration(this.duration)" ontimeupdate="syncDanceCountdown(this)" onended="finishActivity()"></video><span class="dance-tip">${steps[state.danceStep%steps.length]}</span><span class="dance-spark a">✦</span><span class="dance-spark b">✧</span></div><p class="countdown">${Math.ceil(state.seconds)}<span style="font-size:15px"> 秒</span></p><div class="dance-progress"><span style="width:${Math.max(0,(1-state.seconds/(state.danceDuration||state.seconds||1))*100)}%"></span></div><p>不用跳得标准，跟着动一动，把这口气跳出去。</p><div class="btn-row"><button class="btn btn-primary btn-small dance-toggle" onclick="tickExercise()">${state.activityStarted?'重新开始':'开始跳'}</button><button class="btn btn-outline btn-small dance-pause" onclick="toggleDancePause()">暂停</button></div>`}
else if(i===1){body=renderIceGame()}
else if(i===2){body=renderFanGame()}
else if(i===3){const styles=['大叫','喊一句','哈哈大笑','自由发声'];body=`<div class="activity-art">📣</div><p>请确认周围环境适合，并注意保护嗓子。也可以只听轻柔的背景音。</p><div class="choice-row" style="justify-content:center;margin:10px 0">${styles.map(x=>`<button class="choice ${state.shoutStyle===x?'selected':''}" onclick="chooseShout('${x}')">${x}</button>`).join('')}</div><div class="shout-wave ${state.shoutStarted?'':'paused'}">${Array.from({length:25},()=>'<i></i>').join('')}</div><button class="btn btn-primary full" onclick="${state.shoutStarted?'endShout()':'showSheet(\'shoutSafety\')'}">${state.shoutStarted?'结束释放':'开始释放'}</button><button class="btn btn-outline full btn-small" style="margin-top:8px" onclick="toggleNoise()">${state.noisePlaying?'关闭轻柔背景音':'播放轻柔背景音'}</button><p class="helper" style="margin-top:10px">不会录制、转写或保存你的声音。</p>`}
else{const sounds=['雨声','海浪','森林风声','篝火声','夜晚虫鸣','窗边雨声'];body=`<div class="activity-art">${state.noiseType==='篝火声'?'🔥':state.noiseType==='海浪'?'🌊':state.noiseType==='夜晚虫鸣'?'🌙':'🌧️'}</div><p>${state.noisePlaying?'让声音轻轻陪着你。':'选一种声音，安静待一会儿。'}</p><div class="noise-names">${sounds.map(x=>`<button class="noise-choice ${state.noiseType===x?'selected':''}" onclick="selectNoise('${x}')">${x}</button>`).join('')}</div><label class="helper" for="noise-volume">音量</label><input id="noise-volume" class="noise-volume" type="range" min="0" max="100" value="${Math.round(state.noiseVolume*100)}" oninput="setNoiseVolume(this.value)"><div class="choice-row" style="justify-content:center;margin:8px 0 13px"><button class="choice ${state.noiseTime==='5 分钟'?'selected':''}" onclick="setNoiseTime(this,'5 分钟')">5 分钟</button><button class="choice ${state.noiseTime==='10 分钟'?'selected':''}" onclick="setNoiseTime(this,'10 分钟')">10 分钟</button><button class="choice ${state.noiseTime==='20 分钟'?'selected':''}" onclick="setNoiseTime(this,'20 分钟')">20 分钟</button></div><button class="btn btn-primary full" onclick="toggleNoise()">${state.noisePlaying?'Ⅱ　暂停声音':'▶　播放声音'}</button><button class="btn btn-outline full btn-small" style="margin-top:8px" onclick="finishActivity()">结束陪伴</button>`}
return `<div class="backline"><button class="back-btn" onclick="setPage('vent','vent')">‹</button><span>${modes[i].name} · 随时可以停</span></div><div class="activity-card"><div class="eyebrow">这一小会儿，只属于你</div>${body}</div><button class="btn btn-outline full" style="margin-top:14px" onclick="setPage('vent','vent')">换一种方式</button><p class="tiny-note">${modes[i].tip}</p>`}
function pageSuccess(){const msg=modes[state.mode].tip;return `<div class="success-stage"><div class="success-video-wrap"><video class="success-good-video" autoplay playsinline preload="metadata" onclick="this.paused?this.play():this.pause()" aria-label="成长中的情绪树视频"><source src="./assets/tree-growth.mp4" type="video/mp4"></video><button class="success-tree-link" type="button" onclick="setPage('tree','home')">查看情绪树</button></div><h2>你刚刚照顾了自己一下。</h2><p>${modes[state.mode].name} · ${esc(msg)}</p></div><div class="success-actions"><button class="btn btn-primary" onclick="startActivity()">再来一次</button><button class="btn btn-outline" onclick="setPage('vent','vent')">换一种</button></div>`}
function pageThink(){const initial=state.chat.length?'':`${state.talk?`<div class="context-note">我记得你刚才说：${esc(state.talk.length>180?state.talk.slice(0,180)+'…':state.talk)}<br>你不用再讲一遍。</div>`:''}<div class="bubble bot">我会接着刚才的话陪你。${state.mood?`听起来你现在有些${esc(state.mood)}。`:''}我们可以先聊聊感受，再一起看看问题；如果你暂时不想行动，也完全可以。</div>`;const log=state.chat.length?state.chat.map(x=>`<div class="bubble ${x.role}">${esc(x.text)}</div>`).join(''):initial;return `<div class="think-garden"><img class="think-forest-image" src="./assets/think-forest.png" alt=""><div class="think-caption">情绪搭子 · 我在这里陪你</div></div><section class="chat-panel"><div class="eyebrow">沿着刚才的话，慢慢聊</div><div class="chat-log" id="chat-log">${log}</div><div class="suggestions"><button class="suggestion" onclick="sendPreset('我想先被接住，不用急着建议')">先陪我一会儿</button><button class="suggestion" onclick="sendPreset('我们一起梳理一下问题')">一起梳理问题</button><button class="suggestion" onclick="sendPreset('我暂时不想行动，只想聊聊')">暂时不行动</button></div><div class="chat-input"><input id="chat-input" placeholder="说说你现在的想法…" onkeydown="if(event.key==='Enter')sendChat()"><button class="end-chat-inline" onclick="setPage('summary','think')">结束对话</button><button class="send-btn" aria-label="发送" onclick="sendChat()">↑</button></div></section>`}
function pageTree(){return `<div class="tree-heading"><div class="tree-title-row"><div><h1>我的情绪树</h1><p>每一次照顾自己，都会留下年轮。</p></div><button class="more-tree-btn" onclick="setPage('moreTrees','home')">更多树形</button></div></div><div class="tree-hero-card"><img class="tree-main-image" src="./assets/tree-main.png" alt="正在成长的树"><div class="tree-exp-bar"><div class="tree-exp-top"><span>经验值 <b>Lv.1</b></span><strong>120 当前经验</strong></div><div class="tree-exp-track"><i></i></div><div class="tree-exp-foot"><span>距离 Lv.2 还差 280 经验</span><b>120/400</b></div></div></div><div class="tree-stat-grid"><div class="tree-stat yellow"><strong>4 次</strong><span>近 7 天<br>照顾自己</span></div><button class="tree-stat blue" onclick="setPage('achievements','home')"><strong>成就</strong><span>查看已解锁<br>与待解锁徽章</span></button><div class="tree-stat pink"><strong>1 个</strong><span>正在进行<br>的小行动</span></div></div><div class="tree-action-list"><button class="tree-action-row" onclick="state.treeTab='healing';toast('疗愈记录 · 12 次')"><span>疗愈记录 · 12 次</span><span>→</span></button><button class="tree-action-row" onclick="state.treeTab='rings';toast('年轮 · 7 个成长节点')"><span>年轮 · 7 个成长节点</span><span>→</span></button><button class="tree-action-row" onclick="toast('情绪森林即将开放')"><span>情绪森林 · 即将开放</span><span class="heart-mark">♡</span></button></div>`}
function pageMoreTrees(){const trees=[{name:'小院治愈树',img:'./assets/tree-main.png',unlocked:true},{name:'雨夜树',img:'./assets/emotion-sad.png',unlocked:false},{name:'晴空树',img:'./assets/emotion-good.jpg',unlocked:true},{name:'雪松树',img:'./assets/emotion-lonely.jpg',unlocked:false},{name:'风沙树',img:'./assets/emotion-anxious.jpg',unlocked:false},{name:'雷光树',img:'./assets/emotion-angry.png',unlocked:false}];const current=trees[state.treeStyle||0]||trees[0];return `<div class="more-tree-head"><span class="eyebrow">成长收藏</span><h1>更多树形</h1><p>让你的情绪树，慢慢长成喜欢的样子。</p></div><div class="tree-style-preview"><img src="${current.img}" alt="${current.name}"><div class="tree-style-preview-copy"><b>${current.name}</b><span>${current.unlocked?'已解锁 · 当前使用':'尚未解锁 · 继续照顾自己'}</span></div></div><div class="tree-style-grid">${trees.map((tree,index)=>`<button class="tree-style-card ${index===(state.treeStyle||0)?'selected':''}" onclick="state.treeStyle=${index};render()"><span class="tree-style-thumb"><img src="${tree.img}" alt=""></span><b>${tree.name}</b><small>${tree.unlocked?'已解锁':'未解锁'}</small></button>`).join('')}</div><div class="tree-style-bottom"><div><b>${current.name}</b><span>${current.unlocked?'已拥有':'需要继续成长解锁'}</span></div><button class="btn ${current.unlocked?'btn-primary':'btn-outline'}" onclick="${current.unlocked?`toast('已使用 ${current.name}')`:`toast('继续照顾自己，就会慢慢解锁')`}">${current.unlocked?'立即使用':'继续解锁'}</button></div>`}
function pageAchievements(){const badges=[['🌳','森林之王',true],['💧','大出血',false],['🐙','拟态',false],['🔥','汲取',false],['⚔️','屡败屡战',false],['🐺','狼怒',false],['🕊️','涅槃',false],['🐝','蜂群',false],['🐉','再生',false]];return `<div class="achievement-head"><h1>我的成就</h1><p>每一次认真照顾自己，都值得留下勋章。</p></div><div class="achievement-hero"><div class="achievement-name"><b>情绪小树林伙伴</b><span>已获得 1 个成就</span></div><div class="achievement-avatar">🌱</div><div class="achievement-medal"><span>🏅</span></div></div><div class="achievement-tabs"><span class="active">全部</span><span>已获得</span></div><div class="achievement-grid">${badges.map(([icon,name,unlocked])=>`<div class="achievement-badge ${unlocked?'unlocked':''}"><i>${icon}</i><b>${name}</b></div>`).join('')}</div>`}
function treeContent(tab){if(tab==='healing')return `<div class="list-item"><div class="list-icon">🌧️</div><div><strong>森林雨声 · 安静陪伴</strong><small>10 月 1 日 · 有些疲惫</small></div><em>有帮助</em></div><div class="list-item"><div class="list-icon">☁️</div><div><strong>吹走不开心</strong><small>9 月 29 日 · 焦虑</small></div><em>缓和一点</em></div><div class="list-item"><div class="list-icon">🪇</div><div><strong>消气操</strong><small>9 月 26 日 · 身体紧绷</small></div><em>完成</em></div>`;if(tab==='actions')return `<div class="list-item"><div class="list-icon">☘</div><div><strong>给自己留一个不被打扰的晚上</strong><small>来自一次关于工作压力的对话</small></div><em>进行中</em></div><div class="list-item"><div class="list-icon">✉️</div><div><strong>把需要说清楚的事写下来</strong><small>9 月 24 日建立 · 小行动</small></div><em>未开始</em></div>`;if(tab==='rings')return `<div class="list-item"><div class="list-icon">🌱</div><div><strong>第一次把心事说出来</strong><small>你愿意给自己一个被听见的机会</small></div><em>已记录</em></div><div class="list-item"><div class="list-icon">✨</div><div><strong>第一次完成一次疗愈</strong><small>不必一下子变好，慢慢来就好</small></div><em>已记录</em></div><div class="list-item"><div class="list-icon">🪵</div><div><strong>走过困难，也照顾过自己</strong><small>每一次自我照顾，都是一圈年轮</small></div><em>继续生长</em></div>`;return `<div style="text-align:center;padding:20px 10px"><div style="font-size:35px">🌳</div><b style="font-size:13px">情绪森林，正在长大</b><p class="helper">这里以后会有匿名的善意互动。<br>你的倾诉内容不会公开。</p><button class="btn btn-soft btn-small" onclick="toast('情绪森林将在后续版本开放')">了解情绪森林</button></div>`}

function render(){clearInterval(state.iceCoolTimer);state.iceCoolTimer=null;document.body.dataset.page=state.page;header();nav();const pages={home:pageHome,talk:pageTalk,result:pageResult,vent:pageVent,activity:pageActivity,success:pageSuccess,think:pageThink,tree:pageTree,archive:pageArchive,achievements:pageAchievements,moreTrees:pageMoreTrees,summary:pageSummary};$('#content').innerHTML=`<div class="screen-enter">${(pages[state.page]||pageHome)()}</div>`;$('#overlay-root').innerHTML='';const iceInput=$('#ice-text');if(iceInput)iceInput.addEventListener('input',()=>{const counter=$('.ice-count');if(counter)counter.textContent=`${iceInput.value.length} / 100`});document.querySelectorAll('.blow-cloud').forEach(cloud=>{let startX=0,startY=0,holdTimer;const index=Number(cloud.className.match(/cloud-(\d+)/)?.[1]);cloud.addEventListener('pointerdown',event=>{startX=event.clientX;startY=event.clientY;holdTimer=setTimeout(()=>clearBlowCloud(index),480)});cloud.addEventListener('pointerup',event=>{clearTimeout(holdTimer);if(Math.hypot(event.clientX-startX,event.clientY-startY)>14)clearBlowCloud(index)});cloud.addEventListener('pointercancel',()=>clearTimeout(holdTimer))});if($('#ice-game-pro'))startIceMeltLoop()}

function detectEmotion(text){const rules=[['good',['开心','轻松','好一点','舒缓','平静','安心','有希望','慢慢变好']],['sad',['悲伤','难过','伤心','委屈','想哭','失落','不开心','心碎']],['lonely',['孤独','孤单','没人陪','一个人','被孤立','无人理解']],['anxious',['焦虑','紧张','担心','害怕','不安','心慌','慌']],['angry',['生气','愤怒','暴怒','火大','气愤','恼火','气死','气炸','不爽']],['lost',['迷茫','不知道','没方向','困惑','怎么办','纠结','不确定','迷失']]];for(const [key,words] of rules)if(words.some(word=>text.includes(word)))return key;return 'lost'}
function finishTalk(textOverride=''){const text=(textOverride||$('#talk-text')?.value||state.talk).trim();if(!text){toast('先写下一点心里的话，再点击发送');return}state.talk=text;state.emotion=detectEmotion(text);state.mood=({good:'舒缓',sad:'悲伤',lonely:'孤独',anxious:'焦虑',angry:'生气',lost:'迷茫'})[state.emotion];state.level=text.length>90?'中度':'轻度';setPage('result','home')}
function toggleTalkVoice(){if(state.voiceActive&&state.voiceRecognition){state.voiceRecognition.stop();return}const SpeechRecognitionClass=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognitionClass){toast('当前预览环境不支持语音转文字，可以直接在框内打字');return}try{const recognition=new SpeechRecognitionClass();const base=state.talk.trim();recognition.lang='zh-CN';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=event=>{let transcript='';for(let i=0;i<event.results.length;i++)transcript+=event.results[i][0].transcript;state.talk=[base,transcript.trim()].filter(Boolean).join('\n');const field=$('#talk-text');if(field)field.value=state.talk};recognition.onerror=event=>{state.voiceActive=false;state.voiceRecognition=null;if(state.page==='talk')render();toast(event.error==='not-allowed'?'麦克风权限未开启，可以改为打字输入':'语音识别暂不可用，可以改为打字输入')};recognition.onend=()=>{const field=$('#talk-text');if(field)state.talk=field.value;state.voiceActive=false;state.voiceRecognition=null;if(state.page==='talk')render()};state.voiceRecognition=recognition;state.voiceActive=true;render();recognition.start()}catch(error){state.voiceActive=false;state.voiceRecognition=null;render();toast('语音输入暂不可用，可以直接打字')}}

function updateDanceUi(video){const duration=video?.duration||state.danceDuration||state.seconds||1;const remaining=video&&Number.isFinite(video.duration)?Math.max(0,video.duration-video.currentTime):state.seconds;state.seconds=remaining;const n=$('.countdown');if(n)n.innerHTML=`${Math.ceil(remaining)}<span style="font-size:15px"> 秒</span>`;const progress=$('.dance-progress span');if(progress)progress.style.width=`${Math.max(0,Math.min(100,(1-remaining/duration)*100))}%`}

function updateIceGame(){const p=state.iceProgress,cube=$('#ice-cube-pro'),progress=$('#ice-progress'),words=$('#ice-words'),puddle=$('#ice-puddle'),heat=$('#ice-heat'),tip=$('#ice-tip'),taps=$('#ice-taps'),game=$('#ice-game-pro');if(cube){cube.style.setProperty('--ice-scale',Math.max(.23,1-p*.0068));cube.style.setProperty('--ice-opacity',Math.max(0,1-p*.011));cube.style.setProperty('--ice-drop',`${p*.42}px`);cube.classList.toggle('cracked',p>12)}if(progress)progress.style.width=`${p}%`;if(words)words.style.opacity=String(Math.max(0,1-p/82));if(puddle)puddle.style.setProperty('--puddle',Math.min(1,p/100));if(heat)heat.style.setProperty('--heat',Math.min(.8,.16+p/125));if(taps)taps.textContent=`${state.iceTaps} 次加温`;if(tip)tip.textContent=p>=100?'暖意已经留下来了。':p>78?'最后一点点冰，慢慢来。':p>44?'冰面开始变软，呼吸也可以慢一点。':p>12?'听见冰面轻轻响了。':'点一下或按住火把，给冰一点暖意。';if(game)game.classList.toggle('done',p>=100)}

function fanBlow(preferredIndex){if(!state.blowStarted){toast('先启动小风扇，再轻轻吹走乌云');return}if(state.blowBusy)return;const available=state.blowClouds.map((_,i)=>i).filter(i=>!state.blowCleared.includes(i));if(!available.length)return;const index=available.includes(preferredIndex)?preferredIndex:available[Math.floor(Math.random()*available.length)],cloud=$(`[data-cloud="${index}"]`),fan=$('#fan-core'),game=$('#fan-game');state.blowBusy=true;state.blowGusts++;if(fan){fan.classList.remove('spinning');void fan.offsetWidth;fan.classList.add('spinning')}if(game){game.classList.remove('blowing');void game.offsetWidth;game.classList.add('blowing')}if(cloud){const rect=game.getBoundingClientRect(),cRect=cloud.getBoundingClientRect(),x=(cRect.left+cRect.width/2)-(rect.left+rect.width/2),y=(cRect.top+cRect.height/2)-(rect.top+rect.height*.68),length=Math.max(1,Math.hypot(x,y));cloud.style.setProperty('--fly-x',`${x/length*210}px`);cloud.style.setProperty('--fly-y',`${y/length*185}px`);cloud.style.setProperty('--fly-r',`${Math.round(Math.random()*40-20)}deg`);cloud.classList.add('flying')}const status=$('#fan-status');if(status)status.textContent='一阵风吹走了一朵乌云';setTimeout(()=>{state.blowCleared.push(index);state.blowBusy=false;const left=state.blowClouds.length-state.blowCleared.length,count=$('#fan-count'),progress=$('#fan-progress'),tip=$('#fan-tip');if(cloud){cloud.classList.remove('flying');cloud.classList.add('gone')}if(count)count.textContent=`还剩 ${left} 朵`;if(progress)progress.style.width=`${Math.round(state.blowCleared.length/state.blowClouds.length*100)}%`;if(tip)tip.textContent=left?'每一阵风，都只吹走一小朵。':'天空透进光来了。';if(!left){if(game)game.classList.add('done');if(status)status.textContent='晴天来啦，真好！';state.blowCompleteTimer=setTimeout(finishActivity,1000)}},760)}

function endShout(){clearInterval(state.timer);state.shoutStarted=false;finishActivity()}
function stopNoise(){clearTimeout(state.noiseTimer);state.noiseTimer=null;if(state.noiseAudio){try{state.noiseAudio.source.stop()}catch(error){}state.noiseAudio.context.close().catch(()=>{});state.noiseAudio=null}state.noisePlaying=false}
async function toggleNoise(){if(state.noisePlaying){stopNoise();render();return}state.noisePlaying=true;render();const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass){state.noisePlaying=false;toast('此设备暂不支持播放，仍可以安静陪伴');render();return}try{const context=new AudioContextClass();const sampleRate=context.sampleRate;const buffer=context.createBuffer(1,sampleRate*4,sampleRate);const channel=buffer.getChannelData(0);for(let i=0;i<channel.length;i++)channel[i]=(Math.random()*2-1)*.32;const source=context.createBufferSource();source.buffer=buffer;source.loop=true;const filter=context.createBiquadFilter();filter.type='lowpass';filter.frequency.value=state.noiseType.includes('海浪')?420:state.noiseType.includes('虫鸣')?1500:state.noiseType.includes('篝火')?720:950;const gain=context.createGain();gain.gain.value=.035*state.noiseVolume;source.connect(filter);filter.connect(gain);gain.connect(context.destination);await context.resume();source.start();state.noiseAudio={context,source,gain};state.noiseTimer=setTimeout(finishActivity,parseInt(state.noiseTime,10)*60*1000);toast(`${state.noiseType}已开始，随时可以暂停或结束`)}catch(error){state.noisePlaying=false;toast('声音没有启动，可以继续安静陪伴');render()}}
function selectNoise(type){const wasPlaying=state.noisePlaying;if(wasPlaying)stopNoise();state.noiseType=type;render();if(wasPlaying)toggleNoise()}
function setNoiseVolume(value){state.noiseVolume=Number(value)/100;if(state.noiseAudio)state.noiseAudio.gain.gain.setTargetAtTime(.035*state.noiseVolume,state.noiseAudio.context.currentTime,.08)}
function setNoiseTime(el,time){state.noiseTime=time;render();if(state.noisePlaying){clearTimeout(state.noiseTimer);state.noiseTimer=setTimeout(finishActivity,parseInt(time,10)*60*1000)}}
function sendChat(){const input=$('#chat-input');const text=input?.value.trim();if(text)sendConversationMessage(text)}
function sendPreset(text){sendConversationMessage(text)}
function companionPrompt(){return `你是“情绪小树林”的情绪搭子。先接住感受，再帮助用户梳理；每次只问一个关键问题，不说教、不替用户做决定。重要要求：用户刚才已经倾诉过，请根据上下文接着聊，绝不要求用户重新讲一遍；可温和区分事实、感受、猜测和目标；用户愿意时一起形成一个小而可行的下一步；用户不想行动时，明确允许暂时不行动，并继续陪伴。回复简短、温暖、具体，不诊断、不评判。\n\n刚才的倾诉：${state.talk||'用户从“想清楚”入口开始，还没有提供倾诉内容。'}\n当前情绪线索：${state.mood||'尚未判断'}`}
function localCompanionReply(text){if(/不想行动|先不行动|不做计划/.test(text))return '好，我们先不做计划，也不需要马上解决。刚才那件事我会接着记着。此刻你更希望我陪你待一会儿，还是听你说说最难受的部分？';if(/梳理|下一步|小行动|事实/.test(text))return `好，我们只梳理一小步，不用一次解决所有问题。我记得你刚才提到“${(state.talk||'这件让你消耗的事').slice(0,36)}${state.talk.length>36?'…':''}”。我们可以把它分成：发生了什么、你有什么感受、你最在意什么。你想先从哪一部分说起？如果之后你愿意，我们再一起想一个很小的下一步；现在也可以先不行动。`;if(/安慰|接住|陪我/.test(text))return '听见了。你不必现在振作，也不用把事情讲得更完整。我会沿着刚才的话陪着你。此刻最需要被理解的是什么？';return '我听见了，我们可以沿着刚才的话继续，不用从头再讲。现在最让你在意的，是事情本身、你的感受，还是接下来该怎么做？'}
/* Configure a same-origin backend route here; keep model credentials on the server. */
async function requestCompanionReply(currentText){const endpoint=window.EMOTION_AI_ENDPOINT||'';if(!endpoint)return localCompanionReply(currentText);const messages=[{role:'system',content:companionPrompt()},...state.chat.slice(0,-1).map(item=>({role:item.role==='bot'?'assistant':'user',content:item.text}))];const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,context:{recentVenting:state.talk,emotion:state.mood}})});if(!response.ok)throw new Error('AI endpoint unavailable');const data=await response.json();return data.reply||data.choices?.[0]?.message?.content||'我在听，我们可以慢慢来。'}
async function sendConversationMessage(text){if(state.aiBusy){toast('我正在整理刚才的话，稍等一下');return}state.aiBusy=true;state.chat.push({role:'user',text});state.chat.push({role:'bot',text:'小树林正在听…'});const replyIndex=state.chat.length-1;render();$('#content').scrollTop=$('#content').scrollHeight;try{state.chat[replyIndex].text=await requestCompanionReply(text)}catch(error){state.chat[replyIndex].text=localCompanionReply(text);toast('暂时无法连接模型，先由小树林陪你聊着')}state.aiBusy=false;render();$('#content').scrollTop=$('#content').scrollHeight}
function showSheet(type){let title='',body='',buttons='';if(type==='leave'){title='这次体验还没有结束';body='你可以继续现在的体验，也可以保存进度后离开。';buttons=`<button class="btn btn-primary full" onclick="closeSheet()">继续当前体验</button><button class="btn btn-outline full" onclick="closeSheet();toast('进度已为你保留');if(state.pending)setPage(state.pending,state.pending)">保存并离开</button><button class="btn btn-outline full" onclick="closeSheet();if(state.pending)setPage(state.pending,state.pending)">不保存，直接离开</button>`}else if(type==='shoutSafety'){title='开始释放前';body='请确认周围环境适合。可以大叫、喊一句、哈哈笑或自由发声；注意保护嗓子，不要持续过度用力。';buttons=`<button class="btn btn-primary full" onclick="beginShout()">我知道了，开始释放</button><button class="btn btn-outline full" onclick="closeSheet()">先不开始</button>`}else if(type==='melt'){title='冰块开始融化了';body='这件烦恼，先从手里放下来一点。';buttons=`<button class="btn btn-primary full" onclick="closeSheet();finishActivity()">让它融化　✦</button>`}else if(type==='switch'){title='换一种方式也没关系';body='这个方式不太适合你？选择另一个现在更舒服的试试。';buttons=`<div class="choice-row" style="margin-bottom:10px">${modes.map((m,i)=>`<button class="choice" onclick="state.mode=${i};closeSheet();setPage('vent','vent')">${m.icon} ${m.name}</button>`).join('')}</div><button class="btn btn-outline full" onclick="closeSheet()">继续当前方式</button>`}else if(type==='action'){title='记下一个小行动';body='你可以先把它留在行动记录里，之后再决定什么时候开始。';buttons=`<button class="btn btn-primary full" onclick="closeSheet();toast('已添加到行动记录')">保存行动</button><button class="btn btn-outline full" onclick="closeSheet()">先不保存</button>`}else if(type==='settings'){title='小树林设置';body='你可以按自己的需要调整陪伴方式。';buttons=`<div class="memory-toggle"><span>先安慰，再给建议</span><button class="toggle on" onclick="this.classList.toggle('on')"></button></div><button class="btn btn-outline full" onclick="closeSheet()">完成</button>`}else if(type==='memory'){title='管理这条记忆';body='你可以修改或删除它。删除后，小树林不会再在后续对话中引用。';buttons=`<button class="btn btn-soft full" onclick="closeSheet();toast('记忆编辑已开启')">修改摘要</button><button class="btn btn-outline full" onclick="closeSheet();toast('已删除这条记忆')">删除这条记忆</button>`}else if(type==='clear'){title='记忆管理';body='删除后，这些已确认保存的摘要将从档案中移除。';buttons=`<button class="btn btn-outline full" onclick="closeSheet();toast('档案记忆已清空')">清空全部档案</button><button class="btn btn-soft full" onclick="closeSheet()">返回档案</button>`}else{title='结束本次对话';body='本次内容不会自动保存，你可以在结束前确认是否留下摘要。';buttons=`<button class="btn btn-primary full" onclick="closeSheet();setPage('summary','think')">查看会话总结</button><button class="btn btn-outline full" onclick="closeSheet();setPage('home','home')">不保存，结束对话</button>`}$('#overlay-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet"><h3>${title}</h3><p>${body}</p>${buttons}</section></div>`}
function closeSheet(){$('#overlay-root').innerHTML=''}
const baseShowSheet=showSheet;
showSheet=function(type){if(type==='leave'){$('#overlay-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet"><h3>这次体验还没有结束</h3><p>你可以继续现在的体验，也可以直接离开。</p><div class="sheet-actions"><button class="btn btn-primary" onclick="closeSheet()">继续体验</button><button class="btn btn-outline" onclick="closeSheet();setPage('home','home')">直接离开</button></div></section></div>`;return}if(type==='blindbox'){const title='情绪盲盒';const body='打开看看，今天会带你去哪一种照顾自己的方式。';const buttons=`<button class="blind-box" onclick="openBlindBox(this)"><span>🎁</span><strong>打开盲盒</strong><small>随机进入一个小游戏</small></button><button class="btn btn-outline full" onclick="closeSheet()">先不打开</button>`;$('#overlay-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet"><h3>${title}</h3><p>${body}</p>${buttons}</section></div>`;return}baseShowSheet(type)}
function openBlindBox(button){button.classList.add('opening');button.querySelector('span').textContent='✨';const choice=Math.floor(Math.random()*modes.length);setTimeout(()=>{state.mode=choice;closeSheet();startActivity()},820)}
const pageActivityWithLegacyGames=pageActivity;
pageActivity=function(){const i=state.activityMode;if(![1,2,3].includes(i))return pageActivityWithLegacyGames();const games={1:{title:'火把融冰解压小游戏',src:'./火把融冰-解压小游戏.html?embed=1'},2:{title:'乌云小风扇小游戏',src:'./乌云小风扇.html?embed=1'},3:{title:'节拍呐喊小游戏',src:'./节拍呐喊-小游戏.html?embed=1'}};const game=games[i];return `<div class="backline"><button class="back-btn" onclick="setPage('vent','vent')" aria-label="返回游戏选择">‹</button><span>${modes[i].name} · 随时可以停</span></div><iframe class="activity-game-frame" id="embeddedGame" src="${game.src}" title="${game.title}" loading="eager"></iframe><p class="tiny-note">${modes[i].tip}</p>`};
window.addEventListener('message',event=>{const frame=$('#embeddedGame');if(!frame||event.source!==frame.contentWindow||event.data?.type!=='emotion-forest-game-complete')return;const expected=state.activityMode===1?'ice':state.activityMode===2?'fan':'';if(expected&&event.data.game===expected)finishActivity()});
/* Tree growth carousel: five stages, swipe left and right, experience bar below the image. */
const treeStages=[
 {lv:1,name:'幼苗期',exp:120,need:400,img:'./assets/tree-stage-1.png'},
 {lv:2,name:'抽枝期',exp:400,need:900,img:'./assets/tree-stage-2.png'},
 {lv:3,name:'小树期',exp:900,need:1600,img:'./assets/tree-stage-3.png'},
 {lv:4,name:'成长树',exp:1600,need:2600,img:'./assets/tree-stage-4.png'},
 {lv:5,name:'茂盛期',exp:2600,need:4000,img:'./assets/tree-stage-5.png'}
];
state.treeStage=0;
function updateTreeStage(index){
  const stage=treeStages[index]||treeStages[0];
  const next=treeStages[index+1];
  const percent=Math.max(6,Math.min(100,Math.round(stage.exp/stage.need*100)));
  const bar=$('#tree-exp');
  if(bar)bar.innerHTML=`<div class="tree-exp-top"><span>经验值 <b>Lv.${stage.lv}</b><em>${stage.name}</em></span><strong>${stage.exp} 当前经验</strong></div><div class="tree-exp-track"><i style="width:${percent}%"></i></div><div class="tree-exp-foot"><span>${next?`距离 Lv.${next.lv} 还差 ${stage.need-stage.exp} 经验`:'已经长成一片小森林'}</span><b>${stage.exp}/${stage.need}</b></div>`;
  const chip=$('#tree-stage-chip');
  if(chip)chip.textContent=`Lv.${stage.lv} · ${stage.name}`;
  document.querySelectorAll('#tree-dots .dot').forEach((dot,dotIndex)=>dot.classList.toggle('active',dotIndex===index));
  state.treeStage=index;
}
function treeStageIndex(carousel){const width=carousel.clientWidth||1;return Math.max(0,Math.min(treeStages.length-1,Math.round(carousel.scrollLeft/width)))}
function shiftTreeStage(delta){const carousel=$('#tree-carousel');if(!carousel)return;const width=carousel.clientWidth||1;const index=Math.max(0,Math.min(treeStages.length-1,treeStageIndex(carousel)+delta));carousel.scrollTo({left:index*width,behavior:'smooth'});updateTreeStage(index)}
function setupTreeCarousel(){
  const carousel=$('#tree-carousel');if(!carousel)return;
  let queued=false,drag=null;
  carousel.addEventListener('scroll',()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;updateTreeStage(treeStageIndex(carousel))})},{passive:true});
  document.querySelectorAll('#tree-dots .dot').forEach((dot,index)=>dot.addEventListener('click',()=>{const width=carousel.clientWidth||1;carousel.scrollTo({left:index*width,behavior:'smooth'});updateTreeStage(index)}));
  carousel.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse')return;drag={x:event.clientX,left:carousel.scrollLeft};carousel.classList.add('dragging')});
  carousel.addEventListener('pointermove',event=>{if(!drag)return;carousel.scrollLeft=drag.left-(event.clientX-drag.x)});
  const endDrag=()=>{if(!drag)return;drag=null;carousel.classList.remove('dragging');const width=carousel.clientWidth||1;carousel.scrollTo({left:treeStageIndex(carousel)*width,behavior:'smooth'})};
  carousel.addEventListener('pointerup',endDrag);carousel.addEventListener('pointercancel',endDrag);carousel.addEventListener('pointerleave',endDrag);
  const start=Math.max(0,Math.min(treeStages.length-1,state.treeStage||0));
  if(start)requestAnimationFrame(()=>{carousel.scrollLeft=start*carousel.clientWidth});
  updateTreeStage(start);
}
pageTree=function(){
  const slides=treeStages.map(stage=>`<div class="tree-stage-slide"><img src="${stage.img}" alt="Lv.${stage.lv} ${stage.name}" draggable="false"></div>`).join('');
  const dots=treeStages.map((stage,index)=>`<i class="dot ${index===0?'active':''}"></i>`).join('');
  return `<div class="tree-heading"><div class="tree-title-row"><div><h1>我的情绪树</h1><p>每一次照顾自己，都会留下年轮。</p></div><button class="more-tree-btn" onclick="setPage('moreTrees','home')">更多树形</button></div></div><section class="tree-stage-panel"><div class="tree-stage-viewport" id="tree-carousel">${slides}</div><span class="tree-stage-chip" id="tree-stage-chip">Lv.1 · 幼苗期</span><div class="tree-stage-dots" id="tree-dots">${dots}</div><button class="tree-stage-arrow prev" type="button" aria-label="上一棵" onclick="shiftTreeStage(-1)">‹</button><button class="tree-stage-arrow next" type="button" aria-label="下一棵" onclick="shiftTreeStage(1)">›</button></section><section class="tree-exp-bar" id="tree-exp"></section><div class="tree-stat-grid"><div class="tree-stat yellow"><strong>4 次</strong><span>近 7 天<br>照顾自己</span></div><button class="tree-stat blue" onclick="setPage('achievements','home')"><strong>成就</strong><span>查看已解锁<br>与待解锁徽章</span></button><div class="tree-stat pink"><strong>1 个</strong><span>正在进行<br>的小行动</span></div></div><div class="tree-action-list"><button class="tree-action-row" onclick="state.treeTab='healing';toast('疗愈记录 · 12 次')"><span>疗愈记录 · 12 次</span><span>→</span></button><button class="tree-action-row" onclick="state.treeTab='rings';toast('年轮 · 7 个成长节点')"><span>年轮 · 7 个成长节点</span><span>→</span></button><button class="tree-action-row" onclick="toast('情绪森林即将开放')"><span>情绪森林 · 即将开放</span><span class="heart-mark">♡</span></button></div>`;
};
const baseRender=render;
render=function(){baseRender();if($('#tree-carousel'))setupTreeCarousel()};
render();
</script>
